parameters:
  env(SENTRY_DSN): null

when@prod:
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        options:
          traces_sample_rate: 1.0
          # Verwirft Events aus HTTP-Requests ohne authentifizierten User (Scanner-404er).
          # Der Wert ist eine Service-ID: SentryExtension loest ihn per new Reference() auf.
          before_send: 'App\Sentry\AuthenticatedUserEventFilter'
        tracing:
          enabled: true
          dbal: # DB queries
            enabled: true
          cache:
            enabled: true
          twig: # templating engine
            enabled: true

        # Der Monolog-Handler unten meldet bereits jede Exception (Symfonys ErrorListener
        # loggt sie auf Level ERROR). Ohne diese Zeile meldet Sentrys eigener ErrorListener
        # denselben Fehler ein zweites Mal - doppelte Quota fuer null Mehrwert.
        # https://docs.sentry.io/platforms/php/guides/symfony/#monolog-integration
        # register_error_handler bleibt bewusst aktiv: es faengt uncaught Fatals ausserhalb
        # des Kernels ab, die Monolog nie zu sehen bekommt.
        register_error_listener: false

    monolog:
        handlers:
            sentry:
                type: sentry
                level: !php/const Monolog\Logger::ERROR
                hub_id: Sentry\State\HubInterface
